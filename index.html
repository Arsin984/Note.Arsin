<!DOCTYPE html>
<html lang="fa" dir="rtl" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Music.Arsin</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg1:#fff3e8;--bg2:#ffd2b0;--ink:#2a1a12;--mut:#7a5e4f;--glass:rgba(255,255,255,.58);--bd:rgba(255,255,255,.8);--sh:0 10px 30px rgba(180,90,30,.2);--or1:#ffa65c;--or2:#ff6a3d;--mint:#19c9a8;--card:rgba(255,255,255,.7)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#1a110d;--bg2:#2b1810;--ink:#fff1e6;--mut:#c9a995;--glass:rgba(60,38,28,.55);--bd:rgba(255,200,160,.18);--sh:0 10px 30px rgba(0,0,0,.45);--card:rgba(70,44,32,.6)}}
:root[data-theme="dark"]{--bg1:#1a110d;--bg2:#2b1810;--ink:#fff1e6;--mut:#c9a995;--glass:rgba(60,38,28,.55);--bd:rgba(255,200,160,.18);--sh:0 10px 30px rgba(0,0,0,.45);--card:rgba(70,44,32,.6)}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;color:var(--ink);font-family:"Vazirmatn",system-ui,-apple-system,"Segoe UI",sans-serif;background:radial-gradient(circle at 15% 10%,var(--or1) -20%,transparent 40%),radial-gradient(circle at 90% 70%,var(--mint) -30%,transparent 35%),linear-gradient(160deg,var(--bg1),var(--bg2));background-attachment:fixed;transition:color .4s;overflow-x:hidden}
html[lang="en"] body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
.glass{background:var(--glass);border:1px solid var(--bd);box-shadow:var(--sh);backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4)}
/* header */
#top{position:fixed;z-index:50;top:calc(env(safe-area-inset-top,0px) + 12px);inset-inline:12px;max-width:980px;margin-inline:auto;display:flex;align-items:center;gap:12px;padding:8px 10px 8px 16px;border-radius:999px;transform-origin:top right;transition:transform .55s cubic-bezier(.7,0,.2,1),opacity .4s}
html[dir="rtl"] #top{transform-origin:top left;padding:8px 16px 8px 10px}
#top.gone{transform:translateY(-10px) scale(.06);opacity:0;pointer-events:none}
.logo{font-weight:800;display:flex;align-items:center;gap:8px;white-space:nowrap}
.logo b{display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,var(--or1),var(--or2));color:#fff;font-size:16px;animation:pulse 3s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 7px rgba(255,106,61,.18)}}
nav{display:flex;gap:2px;margin-inline:auto}
nav a{padding:7px 10px;border-radius:999px;font-size:14px;position:relative;transition:background .25s,transform .25s}
nav a:hover{background:rgba(255,138,61,.16);transform:translateY(-1px)}
nav a.on{background:linear-gradient(135deg,var(--or1),var(--or2));color:#fff}
.ctl{display:flex;align-items:center;gap:8px}
.seg{position:relative;display:grid;grid-template-columns:1fr 1fr;direction:ltr;width:76px;height:34px;border-radius:999px;background:rgba(127,127,127,.15);overflow:hidden}
.seg i{position:relative;z-index:1;display:grid;place-items:center;font-style:normal;font-size:12px;font-weight:600;transition:color .35s}
.seg .th{position:absolute;inset:3px auto 3px 3px;width:calc(50% - 3px);border-radius:999px;background:linear-gradient(135deg,var(--or1),var(--or2));transition:transform .45s cubic-bezier(.5,1.6,.4,1)}
html[lang="en"] .seg .th{transform:translateX(100%)}
.seg i:first-of-type{color:#fff}html[lang="en"] .seg i:first-of-type{color:inherit}
html[lang="en"] .seg i:last-of-type{color:#fff}
.seg:active .th{width:calc(50% + 4px)}
.tg{position:relative;width:34px;height:34px;border-radius:50%;background:rgba(127,127,127,.15);overflow:hidden;transition:transform .3s}
.tg:hover{transform:rotate(18deg)}
.tg svg{position:absolute;inset:7px;width:20px;height:20px;transition:transform .6s cubic-bezier(.5,1.5,.4,1),opacity .35s}
.tg .moon{color:var(--mint);transform:rotate(-90deg) scale(0);opacity:0}
.tg .sun{color:var(--or2)}
:root[data-theme="dark"] .tg .sun{transform:rotate(90deg) scale(0);opacity:0}
:root[data-theme="dark"] .tg .moon{transform:none;opacity:1}
/* corner button */
#fab{position:fixed;z-index:60;top:calc(env(safe-area-inset-top,0px) + 12px);inset-inline-end:12px;transform:scale(0);transition:transform .5s cubic-bezier(.5,1.7,.4,1)}
#fab.show{transform:scale(1)}
#fabBtn{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;font-size:20px;color:#fff;background:linear-gradient(135deg,var(--or1),var(--or2));box-shadow:var(--sh);transition:transform .4s}
#fab.open #fabBtn{transform:rotate(135deg)}
#pop{position:absolute;top:58px;inset-inline-end:0;width:min(260px,calc(100vw - 24px));padding:12px;border-radius:24px;display:flex;flex-direction:column;gap:10px;transform-origin:top right;transform:scale(.4);opacity:0;pointer-events:none;transition:transform .4s cubic-bezier(.5,1.5,.4,1),opacity .25s}
html[dir="rtl"] #pop{transform-origin:top left}
#fab.open #pop{transform:none;opacity:1;pointer-events:auto}
#pop nav{flex-direction:column;margin:0}
#pop nav a{padding:10px 14px}
#pop .ctl{justify-content:space-between;padding-top:8px;border-top:1px solid var(--bd)}
/* theme reveal */
::view-transition-old(root),::view-transition-new(root){animation:none;mix-blend-mode:normal}
::view-transition-new(root){animation:reveal .65s ease-out}
@keyframes reveal{from{clip-path:circle(0 at var(--x,50%) var(--y,0))}to{clip-path:circle(150% at var(--x,50%) var(--y,0))}}
/* language fade */
main{transition:opacity .18s,transform .18s,filter .18s}
body.sw main{opacity:0;transform:translateY(8px);filter:blur(4px)}
/* layout */
main{max-width:980px;margin:0 auto;padding:96px 16px 40px}
.view{display:none}.view.on{display:block;animation:enter .55s cubic-bezier(.2,.8,.2,1)}
@keyframes enter{from{opacity:0;transform:translateY(22px) scale(.985)}}
.hero{text-align:center;padding:48px 8px 36px}
.hero h1{font-size:clamp(34px,7vw,64px);font-weight:800;margin:0 0 12px;line-height:1.2;background:linear-gradient(120deg,var(--or2),var(--or1) 50%,var(--mint));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{color:var(--mut);max-width:520px;margin:0 auto 26px;line-height:1.9}
.btn{display:inline-flex;align-items:center;gap:8px;padding:12px 24px;border-radius:999px;font-weight:600;color:#fff;background:linear-gradient(135deg,var(--ac,var(--or1)),var(--or2));box-shadow:0 8px 20px rgba(255,106,61,.35);position:relative;overflow:hidden;transition:transform .25s,box-shadow .25s}
.btn::after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.55) 50%,transparent 65%);transform:translateX(-120%);transition:transform .7s}
.btn:hover{transform:translateY(-2px) scale(1.03)}.btn:hover::after{transform:translateX(120%)}
.btn:active{transform:scale(.96)}
.btn.ghost{background:var(--glass);color:var(--ink);box-shadow:var(--sh);border:1px solid var(--bd)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px}
.card{border-radius:28px;padding:20px;background:var(--card);border:1px solid var(--bd);box-shadow:var(--sh);display:flex;flex-direction:column;gap:10px;transition:transform .35s,box-shadow .35s}
.card:hover{transform:translateY(-6px) rotate(-.5deg)}
.ico{height:92px;display:grid;place-items:center;border-radius:20px;color:var(--ac);background:color-mix(in srgb,var(--ac) 14%,transparent)}
.ico svg{width:80px;height:60px;transition:transform .5s cubic-bezier(.5,1.6,.4,1)}
.card:hover .ico svg{transform:scale(1.15) rotate(-6deg)}
.card h3{margin:0}.card p{margin:0;color:var(--mut);font-size:14px;line-height:1.8;flex:1}
.rv{opacity:0;transform:translateY(26px);transition:opacity .6s,transform .6s}.rv.in{opacity:1;transform:none}
h2{margin:36px 0 14px;font-size:22px}
.back{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:999px;margin-bottom:14px;font-size:14px}
html[dir="rtl"] .back i{display:inline-block;transform:scaleX(-1)}
.ph{border-radius:36px;padding:32px 20px;display:flex;align-items:center;gap:24px;flex-wrap:wrap;background:linear-gradient(135deg,color-mix(in srgb,var(--ac) 30%,transparent),var(--card));border:1px solid var(--bd);box-shadow:var(--sh);color:var(--ac)}
.ph svg{width:150px;height:100px;flex:none;animation:float 4s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-8px) rotate(-3deg)}}
.ph div{flex:1;min-width:200px;color:var(--ink)}
.ph h1{margin:0 0 8px;font-size:clamp(28px,5vw,44px)}.ph p{margin:0;color:var(--mut);line-height:1.9}
.chip{display:inline-block;padding:3px 12px;border-radius:999px;font-size:12px;background:color-mix(in srgb,var(--ac) 18%,transparent);color:var(--ac);font-weight:600}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.price{font-weight:800}
.note{margin-top:18px;padding:14px 18px;border-radius:20px;color:var(--mut);font-size:14px}
footer{text-align:center;color:var(--mut);font-size:13px;padding:30px 0 10px}
.view{min-height:90vh}
body::before,body::after{content:"";position:fixed;z-index:-1;width:38vmax;height:38vmax;border-radius:50%;filter:blur(70px);opacity:.35;animation:blob 18s ease-in-out infinite alternate}
body::before{background:var(--or1);top:-10vmax;left:-10vmax}body::after{background:var(--mint);bottom:-12vmax;right:-8vmax;animation-delay:-9s}
@keyframes blob{to{transform:translate(8vmax,6vmax) scale(1.2)}}
#fl{position:fixed;inset:0;z-index:40;pointer-events:none}
#fl span{position:absolute;pointer-events:auto;cursor:grab;user-select:none;-webkit-user-select:none;touch-action:none;filter:drop-shadow(0 6px 8px rgba(0,0,0,.18));animation:bob 5s ease-in-out infinite}
#fl span.drag{cursor:grabbing;animation:none;transform:scale(1.25)}
@keyframes bob{50%{transform:translateY(-14px) rotate(8deg)}}
#fl span.wig{animation:wig .7s}
@keyframes wig{20%{transform:rotate(-25deg) scale(1.3)}40%{transform:rotate(22deg) scale(1.3)}60%{transform:rotate(-14deg)}80%{transform:rotate(8deg)}}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-top:34px}.stats .card{align-items:center;text-align:center;padding:18px}.stats b{font-size:30px;background:linear-gradient(120deg,var(--or2),var(--mint));-webkit-background-clip:text;background-clip:text;color:transparent}.stats span{color:var(--mut);font-size:13px}
.steps,.road{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px}
.num{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800;background:linear-gradient(135deg,var(--ac,var(--or1)),var(--or2))}
.faq{display:flex;flex-direction:column;gap:10px}
details{border-radius:20px;background:var(--card);border:1px solid var(--bd);box-shadow:var(--sh);padding:4px 18px}
summary{cursor:pointer;padding:14px 0;font-weight:600;list-style:none;display:flex;justify-content:space-between;gap:10px}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";font-size:22px;color:var(--or2);transition:transform .35s}
details[open] summary::after{transform:rotate(135deg)}
details p{margin:0 0 14px;color:var(--mut);line-height:1.9;animation:enter .4s}
.pager{display:flex;justify-content:center;gap:8px;margin-top:20px}
.pgb{width:40px;height:40px;border-radius:50%;background:var(--glass);border:1px solid var(--bd);font-weight:600;transition:transform .3s}.pgb:hover{transform:scale(1.12)}.pgb.on{color:#fff;background:linear-gradient(135deg,var(--ac,var(--or1)),var(--or2))}
.hid{display:none}.pg:not(.hid){animation:enter .5s}
.vid{margin-top:34px;display:flex;align-items:center;gap:18px;padding:22px;border-radius:28px;background:var(--card);border:1px solid var(--bd);box-shadow:var(--sh)}.vid h3,.vid p{margin:0}.vid p{color:var(--mut);font-size:14px;margin-top:4px}
.play{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:22px;flex:none;background:linear-gradient(135deg,var(--ac,var(--or1)),var(--or2));animation:pulse 2.5s infinite}
.cta{margin:44px 0 10px;padding:40px 20px;text-align:center;border-radius:36px}.cta h2{margin-top:0}
.big{font-size:34px}
.auth{position:relative;overflow:hidden;display:flex;align-items:center;gap:8px;height:34px;padding:0 14px 0 5px;border-radius:999px;font-weight:600;font-size:13px;color:#fff;white-space:nowrap;background:linear-gradient(135deg,var(--or1),var(--or2));animation:glow 3s ease-in-out infinite;transition:transform .3s}
.auth:hover{transform:translateY(-2px) scale(1.04)}.auth:active{transform:scale(.95)}
.auth::after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.5) 50%,transparent 65%);animation:sweep 3.2s infinite}
@keyframes glow{50%{box-shadow:0 0 0 6px rgba(255,106,61,.22)}}
@keyframes sweep{0%,55%{transform:translateX(-130%)}100%{transform:translateX(130%)}}
.auth .av{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.3);font-size:13px}
.auth.me{background:linear-gradient(135deg,var(--mint),#10a98c);animation:none}.auth.me::after{display:none}
#pop .ctl{flex-wrap:wrap}#pop .auth{flex:1 0 100%;justify-content:center;height:42px}
@media (max-width:480px){#top .auth .at{display:none}#top .auth{padding:0 5px}}
#am{position:fixed;inset:0;z-index:80;display:grid;place-items:center;padding:16px;background:rgba(20,10,5,.42);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);opacity:0;pointer-events:none;transition:opacity .3s}
#am.open{opacity:1;pointer-events:auto}
#ab{position:relative;width:min(400px,100%);padding:30px 22px 22px;border-radius:32px;background:var(--bg1);border:1px solid var(--bd);box-shadow:0 30px 80px rgba(0,0,0,.4);text-align:center;overflow:hidden;transform:translateY(30px) scale(.9);transition:transform .5s cubic-bezier(.5,1.5,.4,1)}
#ab::before{content:"";position:absolute;inset:0 0 auto;height:5px;background:linear-gradient(90deg,var(--or1),var(--or2),var(--mint))}
#am.open #ab{transform:none}
#ab.shake{animation:shake .45s}
@keyframes shake{20%,60%{transform:translateX(-9px)}40%,80%{transform:translateX(9px)}}
#ab h3{margin:6px 0 4px;font-size:21px}#ab p{margin:0 0 16px;color:var(--mut);font-size:14px;line-height:1.8}
#ab .x{position:absolute;top:14px;inset-inline-end:14px;width:32px;height:32px;border-radius:50%;background:rgba(127,127,127,.15);font-size:20px;line-height:1;transition:transform .3s}#ab .x:hover{transform:rotate(90deg)}
.step{animation:enter .45s}
.tabs{position:relative;display:grid;grid-template-columns:1fr 1fr;direction:ltr;border-radius:999px;background:rgba(127,127,127,.15);margin:8px 0 16px;overflow:hidden}
.tabs button{position:relative;z-index:1;padding:9px;font-weight:600;font-size:14px;transition:color .3s}.tabs button.on{color:#fff}
.tabs i{position:absolute;inset:3px auto 3px 3px;width:calc(50% - 3px);border-radius:999px;background:linear-gradient(135deg,var(--or1),var(--or2));transition:transform .45s cubic-bezier(.5,1.5,.4,1)}.tabs.lg i{transform:translateX(100%)}
.fld{width:100%;padding:13px 16px;margin-bottom:10px;border-radius:16px;border:1.5px solid var(--bd);background:var(--card);color:var(--ink);font:inherit;text-align:center;outline:0;transition:border-color .3s,box-shadow .3s;animation:enter .35s}
.fld:focus{border-color:var(--or2);box-shadow:0 0 0 4px rgba(255,106,61,.18)}
.er{min-height:22px;color:#e5484d;font-size:13px;margin-bottom:6px}
.otp{display:flex;justify-content:center;gap:9px;margin:12px 0 4px}
.otp input{width:48px;height:58px;border-radius:16px;border:1.5px solid var(--bd);background:var(--card);color:var(--ink);font-size:24px;font-weight:800;font-family:inherit;text-align:center;outline:0;padding:0;animation:pop .45s backwards;transition:border-color .3s,box-shadow .3s,transform .3s}
.otp input:focus{border-color:var(--or2);box-shadow:0 0 0 4px rgba(255,106,61,.18);transform:translateY(-3px)}.otp input.f{border-color:var(--mint)}
@keyframes pop{from{opacity:0;transform:scale(.4) translateY(14px)}}
.demo{display:inline-flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap;padding:8px 14px;border-radius:18px;font-size:12px;background:rgba(25,201,168,.15);color:var(--mint)}.demo b{font-size:19px;letter-spacing:4px;color:var(--ink)}
.btn.w{width:100%;justify-content:center;font-size:15px;font-family:inherit}
.sub{display:flex;justify-content:space-between;margin-top:14px;font-size:13px;color:var(--mut)}.sub button{color:var(--or2);font-weight:600}.sub button:disabled{color:var(--mut);opacity:.7;cursor:default}
.ok{display:block;width:84px;height:84px;margin:8px auto 14px}.ok circle{fill:none;stroke:var(--mint);stroke-width:4;stroke-dasharray:240;stroke-dashoffset:240;animation:dr .7s forwards}.ok path{fill:none;stroke:var(--mint);stroke-width:5;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:50;stroke-dashoffset:50;animation:dr .5s .55s forwards}@keyframes dr{to{stroke-dashoffset:0}}
.num.big2{width:72px;height:72px;font-size:30px;margin:6px auto 10px}
@media (max-width:760px){#top nav{display:none}#top{justify-content:space-between}.ctl{margin-inline-start:auto}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<header id="top" class="glass">
  <a class="logo" href="#"><b>♪</b>Music.Arsin</a>
  <nav>
    <a href="#" data-r="" data-i="home"></a><a href="#piano" data-r="piano" data-i="piano"></a><a href="#guitar" data-r="guitar" data-i="guitar"></a><a href="#drums" data-r="drums" data-i="drums"></a><a href="#violin" data-r="violin" data-i="violin"></a><a href="#lessons" data-r="lessons" data-i="lessons"></a><a href="#about" data-r="about" data-i="about"></a>
  </nav>
  <div class="ctl">
    <button class="auth js-auth" aria-label="Account"><span class="av">👤</span><span class="at"></span></button>
    <button class="seg js-lang" aria-label="Language / زبان"><span class="th"></span><i>FA</i><i>EN</i></button>
    <button class="tg js-theme" aria-label="Theme">
      <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8"/></svg>
      <svg class="moon" viewBox="0 0 24 24" fill="currentColor"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z"/></svg>
    </button>
  </div>
</header>
<div id="fab"><button id="fabBtn" aria-label="Menu">♪</button><div id="pop" class="glass"></div></div>
<div id="am" role="dialog" aria-modal="true"><div id="ab"></div></div>
<main>
  <section class="view" id="v-home">
    <div class="hero"><h1 data-i="h1"></h1><p data-i="h2"></p><a class="btn" href="#piano" data-i="cta"></a></div>
    <div class="grid" id="grid"></div>
  </section>
  <div id="pages"></div>
  <footer data-i="foot"></footer>
</main>
<script>
var T={fa:{home:"خانه",piano:"پیانو",guitar:"گیتار",drums:"درام",violin:"ویولن",h1:"نت‌های ناب، یادگیری لذت‌بخش",h2:"نت و آموزش ویدیویی پیانو، گیتار، درام و ویولن؛ با پیش‌نمایش رایگان و دسترسی کامل پس از خرید.",cta:"شروع کن",ex:"کاوش",back:"بازگشت",sc:"نت‌های نمونه",pv:"پیش‌نمایش",lock:"نت کامل و ویدیوی آموزشی پس از خرید باز می‌شود.",toman:"تومان",foot:"© Music.Arsin"},
en:{home:"Home",piano:"Piano",guitar:"Guitar",drums:"Drums",violin:"Violin",h1:"Beautiful scores, joyful learning",h2:"Sheet music and video lessons for piano, guitar, drums and violin. Free preview, full access after purchase.",cta:"Get started",ex:"Explore",back:"Back",sc:"Sample scores",pv:"Preview",lock:"The full score and tutorial video unlock after purchase.",toman:"Toman",foot:"© Music.Arsin"}};
var LV={fa:["مبتدی","متوسط","پیشرفته"],en:["Beginner","Intermediate","Advanced"]};
